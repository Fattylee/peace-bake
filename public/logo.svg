<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outer-ring { fill: #5C2E1F; }
      .bg-circle { fill: #E8E8E8; }
      .bread { fill: #D97706; }
      .holes { fill: #5C2E1F; }
      .text-main { font-family: Arial, sans-serif; font-weight: bold; fill: #5C2E1F; }
      .text-halal { font-family: Arial, sans-serif; font-style: italic; fill: #D97706; font-weight: bold; }
      .text-arabic { font-family: Arial, sans-serif; fill: #5C2E1F; font-weight: bold; }
      .text-sub { font-family: Arial, sans-serif; font-size: 12px; fill: #5C2E1F; font-weight: bold; letter-spacing: 2px; }
    </style>
    <!-- Imported bread gradients and styles from copy.svg -->
    <style>
      .bread-main { fill: url(#breadGradient); }
      .bread-shadow { fill: #b45309; opacity: 0.3; }
      .crust { fill: url(#crustGradient); }
      .holes-detail { fill: #92400e; opacity: 0.6; }
    </style>
    <linearGradient id="breadGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity: 1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crustGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="98" class="outer-ring"/>
  
  <!-- White/light background -->
  <circle cx="100" cy="100" r="92" class="bg-circle"/>
  
  <!-- Bread icon replaced with richer bread from copy.svg -->
  <g transform="translate(100,60) scale(1.4)" filter="url(#softShadow)">
    <path d="M -30,-8 C -30,-18 -25,-25 -15,-28 C -8,-30 8,-30 15,-28 C 25,-25 30,-18 30,-8 
             L 30,0 C 30,8 25,14 18,18 L -18,18 C -25,14 -30,8 -30,0 Z"
          class="bread-main"/>
    <ellipse cx="0" cy="-8" rx="30" ry="20" class="crust"/>
    <path d="M -28,15 Q -30,10 -30,0 L -30,-8 C -30,-15 -27,-22 -20,-25 
             C -22,-20 -24,-12 -24,-5 L -24,12 Z"
          class="bread-shadow"/>
    <ellipse cx="-18" cy="-2" rx="3" ry="2.5" class="holes-detail"/>
    <ellipse cx="-10" cy="-5" rx="2.5" ry="2" class="holes-detail"/>
    <ellipse cx="-2" cy="-3" rx="3.5" ry="3" class="holes-detail"/>
    <ellipse cx="8" cy="-6" rx="2.8" ry="2.2" class="holes-detail"/>
    <ellipse cx="18" cy="-1" rx="3.2" ry="2.6" class="holes-detail"/>
    <ellipse cx="-15" cy="6" rx="2.2" ry="1.8" class="holes-detail"/>
    <ellipse cx="-5" cy="8" rx="2.8" ry="2.3" class="holes-detail"/>
    <ellipse cx="5" cy="5" rx="2.5" ry="2" class="holes-detail"/>
    <ellipse cx="15" cy="7" rx="3" ry="2.4" class="holes-detail"/>
    <ellipse cx="-8" cy="13" rx="2" ry="1.5" class="holes-detail"/>
    <ellipse cx="3" cy="14" rx="2.3" ry="1.7" class="holes-detail"/>
    <ellipse cx="12" cy="13" rx="2.1" ry="1.6" class="holes-detail"/>
  </g>
  
  <!-- Main text: PEACE BAKE -->
  <text x="100" y="118" text-anchor="middle" class="text-main" font-size="20">PEACE BAKE</text>
  
  <!-- Arabic Halal text -->
  <text x="100" y="138" text-anchor="middle" class="text-arabic" font-size="16">حلال</text>
  
  <!-- English Halal text -->
  <text x="100" y="152" text-anchor="middle" class="text-halal" font-size="13">HALAL</text>
  
  <!-- Circular Special Bread text path aligned to inner border (center 100,100 r=90) -->
  <defs>
    <!-- Lower arc moved slightly down (5px) away from halal text -->
    <path id="circlePath" d="M 35,115 A 65,65 0 0,0 165,115" fill="none"/>
  </defs>
  <text class="text-sub" font-size="14" letter-spacing="2">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      SPECIAL BREAD
    </textPath>
  </text>
  
  <!-- Inner border accent -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#5C2E1F" strokeWidth="0.5" opacity="0.5"/>
</svg>
